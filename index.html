<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>阅读器</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="一个简洁的电子书阅读器">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="阅读器">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-192x192.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="./icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-512x512.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #333;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }

        /* 顶部栏 */
        .header {
            background: white;
            border-bottom: 1px solid #e5e5e5;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .header-right {
            display: flex;
            align-items: center;
        }







        .file-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
        }

                 .upload-btn {
             background: #f8f9fa;
             border: 1px solid #dee2e6;
             padding: 8px 16px;
             border-radius: 6px;
             cursor: pointer;
             color: #6c757d;
             font-size: 14px;
             font-weight: 500;
             display: flex;
             align-items: center;
             justify-content: center;
             transition: all 0.15s ease;
             user-select: none;
             touch-action: manipulation;
             -webkit-tap-highlight-color: transparent;
         }
         
         .upload-btn:hover {
             background: #e9ecef;
             border-color: #adb5bd;
         }
         
         .upload-btn:active {
             background: #e9ecef;
             transform: scale(0.95);
         }
         
                         .mark-btn {
            background: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            margin-left: 12px;
        }





        /* 阅读区域 */
        .reader {
            flex: 1;
            background: white;
            position: relative;
        }

        #viewer {
            width: 100%;
            height: 100%;
            border: none;
            background: #fefefe;
        }

        /* 底部翻页栏 */
        .controls {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e5e5e5;
            padding: 16px 24px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: 100px;
            padding-top: 12px;
            position: relative;
        }

        .nav-group {
            display: flex;
            gap: 80px;
            align-items: center;
        }

        .nav-btn {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            width: 80px;
            height: 48px;
            border-radius: 8px;
            cursor: pointer;
            color: #6c757d;
            font-size: 20px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active {
            background: #e9ecef;
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .menu-btn {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            cursor: pointer;
            color: #6c757d;
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-btn:active {
            background: #e9ecef;
            transform: scale(0.95);
        }

        .menu-btn {
            position: absolute;
            right: 24px;
            top: 12px;
        }

        .settings-btn {
            position: absolute;
            top: 12px;
            left: 24px;
            background: #f8f9fa;
            color: #6c757d;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-btn:active {
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-size: 18px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .settings-btn:active {
            background: #0056b3;
            transform: scale(0.95);
        }

        /* 加载状态 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #999;
            font-size: 14px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        /* 空状态 */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #999;
        }

        /* 离线状态样式 */
        .offline .header {
            background: #ff6b6b;
            color: white;
        }

        /* 统一面板 */
        .unified-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: white;
            transition: transform 0.3s ease;
            z-index: 1001;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            transform: translateY(100%);
            padding-top: env(safe-area-inset-top);
        }

        .unified-panel::-webkit-scrollbar {
            display: none;
        }

        .unified-panel.show {
            transform: translateY(0);
        }

        /* 书架面板样式 */
        .bookshelf-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: white;
            transition: transform 0.3s ease;
            z-index: 1001;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            transform: translateY(100%);
            padding-top: env(safe-area-inset-top);
        }

        .bookshelf-panel::-webkit-scrollbar {
            display: none;
        }

        .bookshelf-panel.show {
            transform: translateY(0);
        }

        .bookshelf-content {
            padding: 20px;
        }

        .bookshelf-stats {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .stat-value {
            display: block;
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .bookshelf-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .view-mode-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-mode-btn {
            padding: 8px 16px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            background: #f8f9fa;
            color: #6c757d;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-width: 60px;
            text-align: center;
        }

        .view-mode-btn.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .view-mode-btn:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .view-mode-btn.active:hover {
            background: #0056b3;
            border-color: #0056b3;
        }

        .batch-actions {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .batch-info {
            margin-bottom: 12px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .batch-buttons {
            display: flex;
            gap: 8px;
        }

        .batch-buttons .bookshelf-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 4px;
            min-width: 70px;
            text-align: center;
        }

        .bookshelf-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            background: #f8f9fa;
            color: #6c757d;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            min-width: 80px;
            text-align: center;
        }

        .bookshelf-btn:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .bookshelf-btn:active {
            background: #e9ecef;
            transform: scale(0.95);
        }

        .bookshelf-btn.danger {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .bookshelf-btn.danger:hover {
            background: #c82333;
            border-color: #bd2130;
        }

        .bookshelf-btn.danger:active {
            background: #c82333;
            transform: scale(0.95);
        }

        .btn-icon {
            font-size: 16px;
        }

        .books-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 移动设备上减少列表间距 */
        @media (max-width: 768px) {
            .books-list {
                gap: 12px;
            }
            
            .book-item {
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .books-list {
                gap: 10px;
            }
            
            .book-item {
                padding: 10px;
            }
        }

        .books-list.grid-mode {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 32px;
            padding: 32px;
        }

        /* 响应式网格布局 */
        @media (max-width: 768px) {
            .books-list.grid-mode {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 24px;
                padding: 24px;
            }
            
            .book-item.grid-item .book-cover,
            .book-item.grid-item .book-icon {
                width: 80px;
                height: 120px;
                background: transparent;
                border: none;
                box-shadow: none;
            }
        }

        @media (max-width: 480px) {
            .books-list.grid-mode {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 20px;
                padding: 20px;
            }
            
            .book-item.grid-item .book-cover,
            .book-item.grid-item .book-icon {
                width: 60px;
                height: 90px;
                background: transparent;
                border: none;
                box-shadow: none;
            }
        }

        .book-item.grid-item {
            flex-direction: column;
            padding: 0;
            text-align: center;
            min-height: auto;
            position: relative;
            cursor: pointer;
            justify-content: center;
            align-items: center;
            background: transparent;
            border: none;
            border-radius: 0;
        }

        .book-item.grid-item:hover {
            transform: translateY(-4px);
        }

        .book-item.grid-item:active {
            transform: translateY(-2px);
        }

        /* 移动设备上减少动画效果 */
        @media (max-width: 768px) {
            .book-item.grid-item:hover {
                transform: none;
            }
            
            .book-item.grid-item:active {
                transform: none;
            }
        }



        .book-item.grid-item .book-cover {
            width: 100px;
            height: 140px;
            margin: 0;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #e0e0e0;
            background: #f8f9fa;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        .book-item.grid-item .book-icon {
            width: 100px;
            height: 140px;
            margin: 0;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #6c757d;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        .book-item.grid-item .book-info {
            display: none;
        }

        .book-item.grid-item .book-checkbox {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 16px;
            height: 16px;
            border: 2px solid #dee2e6;
            border-radius: 3px;
            background: white;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
            transition: all 0.2s ease;
        }

        .book-item.grid-item .book-checkbox.checked {
            background: #007bff;
            border-color: #007bff;
        }

        .select-mode .book-item.grid-item .book-checkbox {
            display: flex;
        }

        .book-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .book-checkbox {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            border: 2px solid #dee2e6;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            transition: all 0.2s ease;
        }

        .book-checkbox.checked {
            background: #007bff;
            border-color: #007bff;
        }

        .select-mode .book-checkbox {
            display: flex;
        }

        .select-mode .book-item {
            cursor: default;
        }

        .select-mode .book-item:hover {
            transform: none;
            box-shadow: none;
        }

        .book-item:hover {
            background: #e9ecef;
            border-color: #adb5bd;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .book-item:active {
            transform: translateY(0);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }



        .book-cover {
            width: 60px;
            height: 80px;
            margin-right: 12px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid #dee2e6;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #6c757d;
        }

        .book-icon {
            font-size: 24px;
            margin-right: 12px;
            color: #6c757d;
        }

        /* 移动设备上优化书籍封面大小 */
        @media (max-width: 768px) {
            .book-cover {
                width: 50px;
                height: 70px;
                margin-right: 10px;
                font-size: 20px;
            }
            
            .book-icon {
                font-size: 20px;
                margin-right: 10px;
            }
        }

        @media (max-width: 480px) {
            .book-cover {
                width: 45px;
                height: 60px;
                margin-right: 8px;
                font-size: 18px;
            }
            
            .book-icon {
                font-size: 18px;
                margin-right: 8px;
            }
        }

        .book-info {
            flex: 1;
        }

        .book-title {
            font-size: 16px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }

        .book-meta {
            font-size: 12px;
            color: #666;
        }

        /* 移动设备上优化文字大小 */
        @media (max-width: 768px) {
            .book-title {
                font-size: 14px;
                margin-bottom: 3px;
            }
            
            .book-meta {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .book-title {
                font-size: 13px;
                margin-bottom: 2px;
            }
            
            .book-meta {
                font-size: 10px;
            }
        }

        .book-actions {
            display: flex;
            gap: 8px;
        }

        .book-action-btn {
            padding: 6px 10px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            background: #f8f9fa;
            color: #6c757d;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .book-action-btn:hover {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .book-action-btn:active {
            background: #e9ecef;
            transform: scale(0.95);
        }

        .book-action-btn.danger {
            color: #dc3545;
            border-color: #dc3545;
        }

        .book-action-btn.danger:hover {
            background: #dc3545;
            color: white;
        }

        .book-action-btn.danger:active {
            background: #dc3545;
            transform: scale(0.95);
        }

        .empty-bookshelf {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-text {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .empty-subtext {
            font-size: 14px;
        }

        .unified-header {
            padding: 20px;
            border-bottom: 1px solid #e5e5e5;
            background: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .unified-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .unified-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
        }

        .unified-close:hover {
            background-color: #e9ecef;
        }

        /* 分页标签 */
        .tab-bar {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #e5e5e5;
            position: sticky;
            top: 80px;
            z-index: 9;
        }

        .tab-btn {
            flex: 1;
            padding: 16px 20px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: white;
            color: #333;
            border-bottom: 3px solid #007bff;
        }

        .tab-btn:hover {
            background: #e9ecef;
        }

        /* 分页内容 */
        .tab-content {
            display: none;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            max-height: calc(100vh - 180px);
        }

        .tab-content.active {
            display: block;
        }



        /* 书签带子样式 */
        .floating-bookmark {
            position: fixed;
            top: 0;
            right: 20px;
            width: 20px;
            height: 80px;
            background: #ff6b6b;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.2s ease;
            user-select: none;
            touch-action: none;
            border-radius: 0 0 10px 10px;
        }

        .floating-bookmark:active {
            cursor: pointer;
            background: #ff5252;
        }

        /* 模拟状态栏延伸效果 */
        .floating-bookmark::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 0;
            width: 100%;
            height: 25px;
            background: #ff6b6b;
            border-radius: 10px 10px 0 0;
        }

        .floating-bookmark:hover,
        .floating-bookmark:hover::before {
            background: #ff5252;
        }

        .floating-bookmark.dragging {
            transform: translateY(20px);
            background: #ff5252;
            cursor: grabbing;
        }

        .floating-bookmark.dragging::before {
            background: #ff5252;
        }



        .mark-section {
            margin-bottom: 24px;
        }

        .mark-section-title {
            font-size: 16px;

    <script>

        let book = null;
        let rendition = null;
        let currentBookFileName = null;
        
        // 缓存主题设置
        let cachedFontSize = 16;
        let cachedLineHeight = 1.5;
        const defaultFontFamily = "'Microsoft YaHei', sans-serif";
        
        // 标记功能相关变量
        let markWords = [];
        let markNotes = {};
        let markImages = {};
        let markGroups = {};

        


        // 文件选择监听
        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                const file = e.target.files[0];
                console.log('选择文件:', file.name, '大小:', file.size);
                loadBook(file);
                e.target.value = ''; // 清空选择
            }
        });

        // 翻页按钮事件
        function addButtonEvent(buttonId, handler) {
            const button = document.getElementById(buttonId);
            if (button) {
                // 移动设备优化：使用 touchend 而不是 touchstart
                button.addEventListener('touchend', function(e) {
                e.preventDefault();
                    e.stopPropagation();
                handler();
                }, { passive: false });
                
                // 桌面设备
            button.addEventListener('click', handler);
            }
        }

        addButtonEvent('prev-btn', prevPage);
        addButtonEvent('next-btn', nextPage);

        // 目录按钮事件
        addButtonEvent('menu-btn', showUnifiedPanel);

        // 关闭按钮事件
        addButtonEvent('unified-close', hideUnifiedPanel);

        // 遮罩层点击关闭
        document.getElementById('overlay').addEventListener('touchstart', function(e) {
            e.preventDefault();
            hideAllPanels();
        });

        document.getElementById('overlay').addEventListener('click', hideAllPanels);

                 function hideAllPanels() {
             hideUnifiedPanel();
             hideSettings();
            hideBookshelf();
         }

        function showPanel(panelId) {
            hideAllPanels();
            document.getElementById(panelId).classList.add('show');
            document.getElementById('overlay').classList.add('show');
        }





        // 检测是否为移动设备
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                   (window.innerWidth <= 768);
        }

        // 移动设备文件选择
        function triggerMobileFileSelect() {
            console.log('移动设备文件选择...');
            
            // 创建新的文件输入元素
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.epub';
            input.style.position = 'fixed';
            input.style.top = '50%';
            input.style.left = '50%';
            input.style.transform = 'translate(-50%, -50%)';
            input.style.width = '1px';
            input.style.height = '1px';
            input.style.opacity = '0';
            input.style.zIndex = '9999';
            document.body.appendChild(input);
            
            // 添加事件监听器
            input.addEventListener('change', function(e) {
                if (e.target.files && e.target.files[0]) {
                    console.log('移动设备选择文件:', e.target.files[0].name);
                    loadBook(e.target.files[0]);
                }
                // 清理元素
                setTimeout(() => {
                    if (document.body.contains(input)) {
                        document.body.removeChild(input);
                    }
                }, 100);
            });
            
            // 触发文件选择
            input.click();
        }

        // 触发文件选择
        function triggerFileSelect() {
            try {
                console.log('触发文件选择...');
                const isMobile = isMobileDevice();
                console.log('是否为移动设备:', isMobile);
                
                // 移动设备使用专门的处理函数
                if (isMobile) {
                    triggerMobileFileSelect();
                    return;
                }
                
                // 桌面设备使用原有逻辑
                const fileInput = document.getElementById('file-input');
                if (fileInput) {
                    console.log('找到文件输入元素');
                    // 重置文件输入，确保能重复选择同一文件
                    fileInput.value = '';
                    
                    // 触发文件选择
                    fileInput.click();
                    console.log('文件选择已触发');
                } else {
                    console.error('文件输入元素不存在');
                }
            } catch (error) {
                console.error('触发文件选择失败:', error);
                // 备用方案：使用移动设备函数
                triggerMobileFileSelect();
            }
        }

        // 设置按钮事件
        addButtonEvent('settings-btn', showSettings);
        addButtonEvent('settings-close', hideSettings);

        // 书架按钮事件
                    addButtonEvent('bookshelf-close', hideBookshelf);
            addButtonEvent('add-book-btn', triggerFileSelect);
            addButtonEvent('select-mode-btn', toggleSelectMode);
            addButtonEvent('select-all-btn', selectAllBooks);
            addButtonEvent('cancel-select-btn', cancelSelectMode);

                 // 防抖函数
         function debounce(func, wait) {
             let timeout;
             return function executedFunction(...args) {
                 const later = () => {
                     clearTimeout(timeout);
                     func(...args);
                 };
                 clearTimeout(timeout);
                 timeout = setTimeout(later, wait);
             };
         }

        async function updateTOCHighlight() {
            if (!rendition) return;
            
            try {
                const currentLocation = await rendition.currentLocation();
                if (!currentLocation || !currentLocation.start) return;
                
                const currentHref = currentLocation.start.href;
                const tocItems = document.querySelectorAll('#toc-list li[data-href]');
                
                let activeItem = null;
                
                // 一次性遍历，同时移除高亮和找到当前项
                tocItems.forEach(item => {
                    const itemHref = item.getAttribute('data-href');
                    if (itemHref === currentHref) {
                        activeItem = item;
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
                
                // 只在找到当前项时滚动
                if (activeItem) {
                    activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } catch (error) {

        async function loadTOC() {
            if (!book) return;
            
            try {
                const toc = await book.loaded.navigation;
                const tocList = document.getElementById('toc-list');
                tocList.innerHTML = '';
                
                if (toc && toc.toc && toc.toc.length > 0) {
                    // 递归处理目录项，支持无限层级
                    function processTocItems(items, level = 1) {
                        items.forEach((item, index) => {
                            const li = document.createElement('li');
                            const levelClass = level <= 5 ? `toc-item-level-${level}` : 'toc-item-level-5';
                            const titleClass = level <= 5 ? `toc-title-level-${level}` : 'toc-title-level-5';
                            
                            li.className = levelClass;
                            li.setAttribute('data-href', item.href); // 存储href用于匹配当前章节
                            
                            li.innerHTML = `
                                <div class="${titleClass}">${item.label || `章节 ${index + 1}`}</div>
                            `;
                            
                                                         li.addEventListener('click', async () => {
                                 try {
                                     await rendition.display(item.href);
                                     hideUnifiedPanel();
                                                                                                                 // 批量更新UI
                                       debouncedApplyMarks();
                                       debouncedUpdateTOCHighlight();
                                 } catch (error) {
                                     console.error('跳转失败:', error);
                                 }
                             });
                            
                            tocList.appendChild(li);
                            
                            // 如果有子项，递归处理
                            if (item.subitems && item.subitems.length > 0) {
                                processTocItems(item.subitems, level + 1);
                            }
                        });
                    }
                    
                    processTocItems(toc.toc);

                tocList.innerHTML = `

                    </li>
                `;
            }
        }

        async function initMarkData() {
            try {
                const marks = await dataStore.getAllMarks();

                markWords = [];

        // 验证并修复groupId不一致问题
        async function validateAndFixGroupIds() {
            try {
                // 使用已获取的数据，避免重复查询
                const marks = await dataStore.getAllMarks();
                const groups = await dataStore.getAllMarkGroups();
                
                // 检查是否有groupId不一致的问题
                const groupIdsInMarks = new Set(marks.map(m => m.groupId).filter(id => id !== null));
                const groupIdsInGroups = new Set(groups.map(g => g.id));
                
                console.log('验证groupId一致性:', {
                    marks中的groupId: [...groupIdsInMarks],
                    groups中的id: [...groupIdsInGroups]
                });
                
                // 检查数据类型一致性
                let hasTypeInconsistency = false;
                marks.forEach(mark => {
                    if (mark.groupId !== null && typeof mark.groupId !== 'number') {
                        console.warn('发现类型不一致的groupId:', mark.groupId, '类型:', typeof mark.groupId);
                        hasTypeInconsistency = true;
                    }
                });
                
                // 如果发现不一致，重新保存数据
                if (groupIdsInMarks.size > 0 && !groupIdsInMarks.has([...groupIdsInGroups][0]) || hasTypeInconsistency) {
                    console.log('检测到groupId不一致或类型问题，重新保存数据...');
                    await saveMarkData();
                    console.log('数据重新保存完成');
                }
                
            } catch (error) {
                console.error('验证groupId失败:', error);
            }
        }

        // 从数据库加载标记数据
        async function loadMarkDataFromDB(marks, groups) {
            console.log('加载标记数据:', { marks: marks.length, groups: groups.length });
            
            // 创建groupId映射表
            const groupIdMap = new Map();
            
            // 处理分组标记
            groups.forEach(group => {
                console.log('处理组:', group.id, group.words);
                group.words.forEach(word => {
                    markWords.push(word);
                    markNotes[word] = group.note || '';
                    markImages[word] = group.imageData || '';
                    markGroups[word] = group.id;
                    
                    // 记录groupId映射
                    groupIdMap.set(word, group.id);
                });
            });
            
            // 处理未分组的标记
            marks.forEach(mark => {
                if (!mark.groupId) {
                    markWords.push(mark.word);
                    markNotes[mark.word] = '';
                    markImages[mark.word] = '';
                    markGroups[mark.word] = null;
                }
            });
            
            console.log('加载完成:', { 
                markWords: markWords.length, 
                markGroups: Object.keys(markGroups).length,
                groupIdMap: Object.fromEntries(groupIdMap)
            });
            
            // 验证数据一致性
            const uniqueGroupIds = [...new Set(Object.values(markGroups).filter(id => id !== null))];
            console.log('唯一groupId列表:', uniqueGroupIds);
        }

        // 迁移旧数据格式
        async function migrateOldMarkData(oldMarks) {
            try {
                // 按groupId分组
                const groupData = {};
                
                oldMarks.forEach(mark => {
                    const groupId = mark.groupId || 'ungrouped';
                    if (!groupData[groupId]) {
                        groupData[groupId] = {
                            words: [],
                            note: '',
                            imageData: null
                        };
                    }
                    
                    groupData[groupId].words.push(mark.word);
                    
                    // 使用第一个有注释和图片的词汇的数据
                    if (!groupData[groupId].note && mark.note) {
                        groupData[groupId].note = mark.note;
                    }
                    if (!groupData[groupId].imageData && mark.imageData) {
                        groupData[groupId].imageData = mark.imageData;
                    }
                });
                
                // 清空旧数据
                for (const mark of oldMarks) {
                    await dataStore.deleteMark(mark.id);
                }
                
                // 创建新的数据结构
                for (const [oldGroupId, data] of Object.entries(groupData)) {
                    if (oldGroupId === 'ungrouped') {
                        // 未分组的标记
                        for (const word of data.words) {
                            await dataStore.addMark(word);
                        }
                    } else {
                        // 分组的标记
                        const newGroupId = await dataStore.addMarkGroup(
                            `标记组_${oldGroupId}`, 
                            data.words, 
                            data.note, 
                            data.imageData
                        );
                        
                        for (const word of data.words) {
                            await dataStore.addMark(word, newGroupId);
                        }
                    }
                }
                
                console.log('数据迁移完成');
            } catch (error) {
                console.error('数据迁移失败:', error);
            }
        }

        // 保存标记数据到IndexedDB
        async function saveMarkData() {
            try {
                // 清空现有标记和标记组
                const existingMarks = await dataStore.getAllMarks();
                for (const mark of existingMarks) {
                    await dataStore.deleteMark(mark.id);
                }
                
                const existingGroups = await dataStore.getAllMarkGroups();
                for (const group of existingGroups) {
                    await dataStore.deleteMarkGroup(group.id);
                }
                
                // 按组整理数据
                const groupData = {};
                for (let i = 0; i < markWords.length; i++) {
                    const word = markWords[i];
                    const groupId = markGroups[word] || 'ungrouped';
                    
                    if (!groupData[groupId]) {
                        groupData[groupId] = {
                            words: [],
                            note: '',
                            imageData: null
                        };
                    }
                    
                    groupData[groupId].words.push(word);
                    
                    // 使用第一个词汇的注释和图片作为组的注释和图片
                    if (!groupData[groupId].note) {
                        groupData[groupId].note = markNotes[word] || '';
                    }
                    if (!groupData[groupId].imageData) {
                        groupData[groupId].imageData = markImages[word] || null;
                    }
                }
                
                // 保存标记组
                for (const [oldGroupId, data] of Object.entries(groupData)) {
                    if (oldGroupId === 'ungrouped') {
                        // 未分组的标记，每个词汇单独保存
                        for (const word of data.words) {
                            await dataStore.addMark(word);
                        }
                    } else {
                        // 分组的标记，保存为组
                        const newGroupId = await dataStore.addMarkGroup(
                            `标记组_${oldGroupId}`, 
                            data.words, 
                            data.note, 
                            data.imageData
                        );
                        
                        // 为组内每个词汇创建标记记录
                        for (const word of data.words) {
                            await dataStore.addMark(word, newGroupId);
                        }
                    }
                }

            } catch (error) {
                console.error('保存标记数据失败:', error);
            }
        }

        function applyMarks() {
            if (!rendition || markWords.length === 0) return;
            
            const viewer = document.getElementById('viewer');
            const iframe = viewer.querySelector('iframe');
            if (!iframe || !iframe.contentDocument) return;
            
            // 缓存常用值
            const doc = iframe.contentDocument;
            const body = doc.body;
            
            // 移除之前的标记
            const existingMarks = doc.querySelectorAll('.mark-note, .mark-image');
            existingMarks.forEach(mark => mark.remove());
            
            // 预编译正则表达式和缓存标记数据
            const wordData = markWords.map(word => ({
                word,
                regex: new RegExp(`(${word})`, 'gi'),
                note: markNotes[word] || '',
                image: markImages[word] || ''
            }));
            
            // 一次性获取所有文本节点
            const textNodes = [];
            const walker = doc.createTreeWalker(body, NodeFilter.SHOW_TEXT, null, false);
            
            let node;
            while (node = walker.nextNode()) {
                textNodes.push(node);
            }
            
            // 批量处理文本节点
            textNodes.forEach(textNode => {
                // 检查是否在特殊元素中（标题、导航等）
                const parentElement = textNode.parentElement;
                if (!parentElement) return;
                
                // 跳过标题、导航等特殊元素
                const tagName = parentElement.tagName.toLowerCase();
                const className = typeof parentElement.className === 'string' ? parentElement.className.toLowerCase() : '';
                const id = parentElement.id ? parentElement.id.toLowerCase() : '';
                
                // 检查是否在标题或导航元素中
                const isHeading = tagName.match(/^h[1-6]$/);
                const isNavigation = tagName === 'nav' || (className && className.includes('nav')) || (id && id.includes('nav'));
                const isToc = (className && className.includes('toc')) || (id && id.includes('toc'));
                const isTitle = (className && className.includes('title')) || (id && id.includes('title'));
                const isHeader = (className && className.includes('header')) || (id && id.includes('header'));
                
                if (isHeading || isNavigation || isToc || isTitle || isHeader) {
                    
                    return;
                }
                
                // 检查是否在epub.js的特殊元素中
                const isEpubSpecial = (className && className.includes('epub')) || 
                                    (className && className.includes('chapter')) || 
                                    (className && className.includes('section')) ||
                                    parentElement.closest('.epub-container') ||
                                    parentElement.closest('.chapter') ||
                                    parentElement.closest('.section');
                
                // 检查是否在标题相关的元素中
                const isInTitle = parentElement.closest('h1, h2, h3, h4, h5, h6, .title, .chapter-title, .section-title');
                
                if (isEpubSpecial || isInTitle) {
                    
                    return;
                }
                
                // 确保只在正文段落中应用标记
                const isInParagraph = parentElement.tagName === 'P' || 
                                    parentElement.tagName === 'DIV' ||
                                    parentElement.closest('p, div');
                
                if (!isInParagraph) {
                    
                    return;
                }
                
                const text = textNode.textContent;
                
                // 收集所有匹配项，按位置排序
                const matches = [];
                wordData.forEach(({ word, regex, note, image }) => {
                    if (!text.toLowerCase().includes(word.toLowerCase())) return;
                    
                    regex.lastIndex = 0; // 重置正则表达式状态
                    let match;
                    while ((match = regex.exec(text)) !== null) {
                        matches.push({
                            start: match.index,
                            end: match.index + match[1].length,
                            word: match[1],
                            note,
                            image
                        });
                    }
                });
                
                // 如果没有匹配项，跳过
                if (matches.length === 0) return;
                
                // 按位置排序，处理重叠匹配
                matches.sort((a, b) => a.start - b.start);
                
                // 合并重叠的匹配项
                const mergedMatches = [];
                for (const match of matches) {
                    if (mergedMatches.length === 0) {
                        mergedMatches.push(match);
                        continue;
                    }
                    
                    const lastMatch = mergedMatches[mergedMatches.length - 1];
                    
                    // 如果当前匹配与上一个重叠，选择更长的匹配
                    if (match.start <= lastMatch.end) {
                        if (match.end - match.start > lastMatch.end - lastMatch.start) {
                            mergedMatches[mergedMatches.length - 1] = match;
                        }
                    } else {
                        mergedMatches.push(match);
                    }
                }
                
                // 构建替换内容
                const fragment = doc.createDocumentFragment();
                let lastIndex = 0;
                
                mergedMatches.forEach(match => {
                    // 添加匹配前的文本
                    if (match.start > lastIndex) {
                        fragment.appendChild(doc.createTextNode(text.slice(lastIndex, match.start)));
                    }
                    
                    // 添加匹配的文本
                    fragment.appendChild(doc.createTextNode(match.word));
                    
                    // 添加标记内容
                    if (match.note) {
                        const markNote = doc.createElement('span');
                        markNote.className = 'mark-note';
                        markNote.textContent = match.note;
                        markNote.style.cssText = `
                            margin-left: 4px;
                            font-size: 0.9em;
                            color: #666;
                            cursor: pointer;
                            padding: 1px 3px;
                            border-radius: 2px;
                            transition: background-color 0.2s;
                        `;
                        
                        // 点击注释打开编辑界面
                        markNote.onclick = () => {
                            const groupId = markGroups[match.word];
                            if (groupId !== null && groupId !== undefined) {
                                editMarkGroup(groupId);
                            }
                        };
                        
                        markNote.onmouseenter = function() {
                            this.style.backgroundColor = '#f0f0f0';
                        };
                        
                        markNote.onmouseleave = function() {

                    }
                    
                    lastIndex = match.end;
                });
                
                // 添加剩余文本
                if (lastIndex < text.length) {
                    fragment.appendChild(doc.createTextNode(text.slice(lastIndex)));

                // 替换节点

        // 书签功能
        function initBookmarkDrag() {
            const bookmark = document.getElementById('floating-bookmark');
            
            // 长按或拖拽添加书签
            let startY = 0;
            let currentY = 0;
            let isDragging = false;
            let dragThreshold = 30; // 需要拖拽30px才触发添加书签
            let startTime = 0;
            let isClick = false;

            // 鼠标事件
            bookmark.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', endDrag);

            // 触摸事件
            bookmark.addEventListener('touchstart', startDrag);
            document.addEventListener('touchmove', drag);
            document.addEventListener('touchend', endDrag);

            function startDrag(e) {
                e.preventDefault();
                isDragging = true;
                isClick = true;
                startTime = Date.now();
                startY = e.type === 'mousedown' ? e.clientY : e.touches[0].clientY;
                currentY = startY;
                bookmark.classList.add('dragging');
            }

            function drag(e) {
                if (!isDragging) return;
                e.preventDefault();
                currentY = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;
                const deltaY = currentY - startY;
                
                // 如果移动距离超过阈值，不是点击
                if (Math.abs(deltaY) > 5) {
                    isClick = false;
                }
                
                // 限制只能向下拖拽
                if (deltaY > 0) {
                    bookmark.style.transform = `translateY(${Math.min(deltaY, dragThreshold)}px)`;
                }
            }

            function endDrag(e) {
                if (!isDragging) return;
                e.preventDefault();
                isDragging = false;
                
                const deltaY = currentY - startY;
                const duration = Date.now() - startTime;
                
                // 如果是短时间内的轻微移动，认为是点击
                if (isClick && duration < 300 && Math.abs(deltaY) < 10) {
                    goToBookmark();
                }
                // 如果拖拽距离超过阈值，添加书签
                else if (deltaY >= dragThreshold) {
                    addBookmark();
                }
                
                // 重置样式
                bookmark.classList.remove('dragging');
                bookmark.style.transform = '';
            }
        }

        // 自动加载上次阅读的书籍
        async function autoLoadLastBook() {
            try {
                const lastReadBook = await dataStore.getLastReadBook();
                if (!lastReadBook) {
                    showDefaultEmptyState();
                    return;
                }

                // 检查书籍数据是否存在
                let bookData = lastReadBook.data;
                if (!bookData && lastReadBook.fileData) {
                    // 处理旧的数据结构（ArrayBuffer）
                    console.log('检测到旧的数据结构，转换为base64');
                    const arrayBuffer = lastReadBook.fileData;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    const binaryString = Array.from(uint8Array, byte => String.fromCharCode(byte)).join('');
                    bookData = 'data:application/epub+zip;base64,' + btoa(binaryString);
                }
                
                if (!bookData) {
                    console.error('书籍数据不存在:', lastReadBook);
                    showDefaultEmptyState();
                    return;
                }

                // 显示加载提示
                const emptyState = document.getElementById('empty-state');
                emptyState.innerHTML = `
                    <div class="icon">📖</div>
                    <div class="text">正在加载：${lastReadBook.name}</div>
                    <div class="subtext">请稍候...</div>
                `;

                console.log('开始加载书籍:', lastReadBook.name);
                console.log('书籍数据长度:', bookData.length);

                // 将 base64 数据转换为 File 对象
                const response = await fetch(bookData);
                const blob = await response.blob();
                const bookFile = new File([blob], lastReadBook.name, {
                    type: 'application/epub+zip',
                    lastModified: lastReadBook.lastModified
                });

                console.log('书籍文件创建成功:', bookFile.name, bookFile.size);

                // 加载书籍（跳过保存，因为书籍已经在数据库中）
                await loadBook(bookFile, true);
                

                
            } catch (error) {
                console.error('自动加载书籍失败:', error);
                showDefaultEmptyState();
            }
        }

        // 图片压缩和优化函数
        function compressImage(file, maxWidth = 800, maxHeight = 600, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                if (!ctx) {
                    reject(new Error('Canvas 2D上下文不可用'));
                    return;
                }
                
                const img = new Image();
                
                img.onload = function() {
                    try {
                        // 计算新的尺寸
                        let { width, height } = img;
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        if (height > maxHeight) {
                            width = (width * maxHeight) / height;
                            height = maxHeight;
                        }
                        
                        // 设置canvas尺寸
                        canvas.width = width;
                        canvas.height = height;
                        
                        // 绘制图片
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // 直接使用JPEG格式，确保兼容性
                        const format = 'image/jpeg';
                        const finalQuality = Math.min(quality, 0.9); // JPEG质量限制
                        
                        let compressedDataUrl;
                        try {
                            compressedDataUrl = canvas.toDataURL(format, finalQuality);
                        } catch (error) {
                            console.log('格式转换失败，尝试JPEG:', error);
                            // 如果指定格式失败，尝试JPEG
                            compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        }
                        
                        // 验证压缩效果
                        const compressedSize = Math.round(compressedDataUrl.length * 0.75);
                        const compressionRatio = Math.round((1 - compressedSize / file.size) * 100);
                        
                        console.log('图片压缩完成:', {
                            原始大小: file.size,
                            压缩后大小: compressedSize,
                            压缩比例: compressionRatio + '%',
                            格式: format,
                            质量: finalQuality
                        });
                        
                        // 如果压缩效果不好，降低质量重试
                        if (compressedSize > file.size) {
                            console.log('压缩效果不佳，降低质量重试');
                            try {
                                const retryDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                                const retrySize = Math.round(retryDataUrl.length * 0.75);
                                
                                if (retrySize < compressedSize) {
                                    console.log('使用更低质量:', retrySize);
                                    URL.revokeObjectURL(url);
                                    resolve(retryDataUrl);
                                    return;
                                }
                            } catch (error) {
                                console.log('重试压缩失败:', error);
                            }
                        }
                        
                        // 清理临时URL
                        URL.revokeObjectURL(url);
                        resolve(compressedDataUrl);
                        
                    } catch (error) {
                        console.error('图片压缩失败:', error);
                        // 清理临时URL
                        URL.revokeObjectURL(url);
                        reject(error);
                    }
                };
                
                img.onerror = function() {
                    // 清理临时URL
                    URL.revokeObjectURL(url);
                    reject(new Error('图片加载失败'));
                };
                
                // 创建临时URL
                const url = URL.createObjectURL(file);
                img.src = url;
            });
        }

        // 导出标记数据
        async function exportMarksData() {
            try {
                // 获取所有标记数据
                const marks = await dataStore.getAllMarks();
                const markGroups = await dataStore.getAllMarkGroups();
                
                // 分析图片数据大小
                let totalImageSize = 0;
                let imageCount = 0;
                const imageSizes = [];
                
                markGroups.forEach(group => {
                    if (group.imageData) {
                        const size = Math.round(group.imageData.length * 0.75);
                        totalImageSize += size;
                        imageCount++;
                        imageSizes.push({
                            group: group.name,
                            size: size,
                            format: group.imageData.includes('image/jpeg') ? 'JPEG' : 
                                   group.imageData.includes('image/webp') ? 'WebP' : 'PNG'
                        });
                    }
                });
                
                // 构建导出数据
                const exportData = {
                    version: '1.0',
                    exportDate: new Date().toISOString(),
                    marks: marks,
                    markGroups: markGroups
                };
                
                // 创建下载链接
                const dataStr = JSON.stringify(exportData, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `marks_export_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // 清理URL
                URL.revokeObjectURL(url);
                
                // 显示导出信息
                const totalSize = Math.round(dataBlob.size / 1024);
                const imageSizeKB = Math.round(totalImageSize / 1024);
                const dataSizeKB = totalSize - imageSizeKB;
                
                console.log('标记数据导出成功', {
                    总大小: totalSize + 'KB',
                    图片大小: imageSizeKB + 'KB',
                    数据大小: dataSizeKB + 'KB',

                console.log(`标记数据导出成功！总大小: ${totalSize}KB，图片: ${imageCount}张 (${imageSizeKB}KB)，数据: ${dataSizeKB}KB`);

                for (const mark of existingMarks) {
                    await dataStore.deleteMark(mark.id);

                const existingGroups = await dataStore.getAllMarkGroups();
                for (const group of existingGroups) {
                    await dataStore.deleteMarkGroup(group.id);

                // 导入新数据
                for (const group of importData.markGroups) {
                    await dataStore.addMarkGroup(group.name, group.words, group.note, group.imageData);
                }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 打开书籍
        async function openBook(bookName) {
            // 在选择模式下阻止打开书籍
            if (isSelectMode) {
                toggleBookSelection(bookName);
                return;
            }
            
            try {
                console.log('打开书籍:', bookName);
                
                // 获取书籍数据
                const book = await dataStore.getBook(bookName);
                if (!book) {
                    alert('书籍不存在');
                    return;
                }
                
                // 检查书籍数据是否存在
                let bookData = book.data;
                if (!bookData && book.fileData) {
                    // 处理旧的数据结构（ArrayBuffer）
                    console.log('检测到旧的数据结构，转换为base64');
                    const arrayBuffer = book.fileData;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    const binaryString = Array.from(uint8Array, byte => String.fromCharCode(byte)).join('');
                    bookData = 'data:application/epub+zip;base64,' + btoa(binaryString);
                }
                
                if (!bookData) {
                    alert('书籍数据不存在');
                    return;
                }
                
                // 将 base64 数据转换为 File 对象
                const response = await fetch(bookData);
                const blob = await response.blob();
                const bookFile = new File([blob], book.name, {
                    type: 'application/epub+zip',
                    lastModified: book.lastModified
                });
                
                // 加载书籍（跳过保存，因为书籍已经在数据库中）
                await loadBook(bookFile, true);
                
                // 隐藏书架面板
                hideBookshelf();
                
            } catch (error) {
                console.error('打开书籍失败:', error);
                alert('打开书籍失败：' + error.message);
            }
        }

                // 删除书籍
                await dataStore.deleteBook(bookName);
                
                // 如果删除的是当前书籍，清空状态
                if (bookName === currentBookFileName) {
                    currentBookFileName = null;
                    if (book) {
                        book = null;
                    }
                    if (rendition) {
                        rendition = null;
                    }
                    
                    // 清空阅读器
                    const viewer = document.getElementById('viewer');
                    if (viewer) {
                        viewer.innerHTML = '<div class="empty-state">请选择书籍文件</div>';
                    }
                }
                
                // 更新书架显示
                await updateBookshelf();
                
                console.log('书籍删除成功');
                
            } catch (error) {
                console.error('删除书籍失败:', error);
                alert('删除失败：' + error.message);
            }
        }

        // 更新存储信息显示
        async function updateStorageInfo() {
            try {
                const storageInfo = await dataStore.getStorageInfo();
                
                // 更新标记数据信息
                const marksTotalSize = (storageInfo.marks?.size || 0) + (storageInfo.markGroups?.size || 0);
                const marksTotalCount = (storageInfo.marks?.count || 0) + (storageInfo.markGroups?.count || 0);
                const marksElement = document.getElementById('marks-storage-info');
                if (marksElement) {
                    marksElement.textContent = `${marksTotalCount} 项，${formatFileSize(marksTotalSize)}`;
                }
                
                // 更新总存储信息
                const totalElement = document.getElementById('total-storage-info');
                if (totalElement) {
                    totalElement.textContent = `${storageInfo.total.count} 项，${formatFileSize(storageInfo.total.size)}`;
                }
                
            } catch (error) {
                console.error('更新存储信息失败:', error);
                // 显示错误状态
                const marksElement = document.getElementById('marks-storage-info');
                const totalElement = document.getElementById('total-storage-info');
                
                if (marksElement) marksElement.textContent = '获取失败';
                if (totalElement) totalElement.textContent = '获取失败';
            }
        }

        // 清空所有标记
        async function clearAllMarks() {
            if (!confirm('确定要清空所有标记数据吗？此操作不可恢复！')) {
                return;
            }
            
            try {
                console.log('开始清空所有标记数据...');
                
                // 使用事务方式清空，确保数据一致性
                await dataStore.clearAll();
                
                // 清空内存数据
                markWords = [];
                markNotes = {};
                markImages = {};
                markGroups = {};
                
                // 更新界面
                updateMarkList();
                
                // 更新存储信息显示
                await updateStorageInfo();
                
                console.log('所有标记数据已清空');
                alert('所有标记数据已成功清空');
                
            } catch (error) {
                console.error('清空标记数据失败:', error);
                alert(`清空失败：${error.message}\n\n请刷新页面后重试`);
            }
        }




    </script>
</body>
</html>
